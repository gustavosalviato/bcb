services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: bcb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d bcb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3333:3333"
    environment:
      PORT: "3333"
      DATABASE_URL: "postgresql://docker:docker@db:5432/bcb?schema=public"
      ADMIN_API_KEY: "admin-api-key"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: